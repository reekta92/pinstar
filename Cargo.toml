[package]
name = "pinstar"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal-based canvas editor for .canvas files"
authors = ["reekta92 <mdag.92988@protonmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/reekta92/clin"
homepage = "https://github.com/reekta92/clin"

[[bin]]
name = "pinstar"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
anyhow = "1.0"
regex = "1.10"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pinstar", dest = "/usr/bin/pinstar", mode = "0755" },
]
