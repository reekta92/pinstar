[package]
name = "pinstar"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal-based canvas editor for .canvas files"
authors = ["reekta92 <mdag.92988@protonmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/reekta92/clin"
homepage = "https://github.com/reekta92/clin"

[lib]
name = "pinstar"
path = "src/lib.rs"

[[bin]]
name = "pinstar"
path = "src/main.rs"

[features]
default = ["images"]
images = ["dep:image", "dep:ratatui-image", "dep:lru"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
anyhow = "1.0"
regex = "1.10"
lru = { version = "0.18.1", optional = true }
image = { version = "0.25", optional = true }
ratatui-image = { version = "11.0.6", optional = true, default-features = false, features = ["crossterm", "image-defaults"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pinstar", dest = "/usr/bin/pinstar", mode = "0755" },
]
